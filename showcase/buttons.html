  <!-- Sound-Steuerung: gemeinsame Lautstärke für alle Sounds + Stop -->
  <script>
    let masterVolume = 0.5;

    function applyVolume() {
      document.querySelectorAll('audio').forEach(a => a.volume = masterVolume);
      document.getElementById('volumeAnzeige').textContent = Math.round(masterVolume * 100) + '%';
    }

    function setVolume(v) {
      masterVolume = Math.min(1, Math.max(0, v));
      applyVolume();
    }

    function changeVolume(delta) {
      setVolume(Math.round((masterVolume + delta) * 100) / 100);
    }

    function stopAllSounds() {
      document.querySelectorAll('audio').forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
    }

    applyVolume();
  </script>
